# =============================================================================
# Известные ограничения (см. ADR-0009)
# =============================================================================

known_limitations:
  - id: iea_omr_full
    description: IEA OMR full version за paywall с 2020. Используем free version (~5 стр).
  - id: opec_woo_registration
    description: OPEC WOO требует одноразовой бесплатной регистрации на publications.opec.org — поэтому скачан вручную, не через fetch_corpus.py.
  - id: opec_momr
    description: OPEC MOMR PDF за Cloudflare challenge. Заменён на IEF Comparative Analysis (включает выжимки MOMR).
  - id: csis_iran
    description: CSIS публикует только HTML (не PDF). Заменён на CRS reports.
  - id: vygon_consulting
    description: |
      Vygon Consulting публикации защищены WAF (curl получает заглушку).
      Нужно ручное скачивание через браузер с https://vygon.consulting/pressroom/our-publications/.
      Опционально, не блокирует RAG.
  - id: gazprom_msfo_post_2022
    description: |
      Газпром не публикует МСФО с 2022 г. Используем Бухгалтерскую отчётность по РСБУ
      (gazprom_accounting_2024) как единственный финансовый источник.

# =============================================================================
# Что в корпус НЕ попадает (явные исключения по дизайну)
# =============================================================================

excluded_by_design:
  - id: monthly_archive
    description: |
      Не берём более одного номера monthly-документов (MOMR, STEO, OMR) — для свежих
      данных используется web-search в runtime. Глубокий архив в RAG не нужен.
  - id: global_majors
    description: |
      Не берём annual reports глобальных мейджоров (Aramco, Shell, Exxon, BP, Chevron).
      Фокус ассистента — РФ-периметр; глобальный взгляд покрывается через OPEC WOO/IEA Oil/GIIGNL.
  - id: paid_subscriptions
    description: |
      Не используем платные подписки (Wood Mackenzie, Rystad Energy, S&P Platts, Argus,
      Refinitiv) — open-access only.
