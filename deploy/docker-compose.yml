# nefteboros — docker-compose
#
# Сервисы:
#   web   — nefteboros server (Ouroboros + neftegaz_analyst skill)
#
# Volumes:
#   /app/data — DATA_DIR (state, logs, observability traces).
#   По умолчанию named volume `nefteboros_data` (dev). На проде задаём
#   `NEFTEBOROS_HOST_DATA=/root/nefteboros/data` чтобы bind-mount-ить
#   существующий native drive с state/skills/vectorstore/logs.
#
# Запуск (из корня репо):
#   # Dev (named volume, fresh state):
#   docker compose -f deploy/docker-compose.yml up -d --build
#
#   # Prod (bind mount существующего drive):
#   NEFTEBOROS_HOST_DATA=/root/nefteboros/data \
#       docker compose -f deploy/docker-compose.yml up -d --build
#
#   docker compose -f deploy/docker-compose.yml logs -f web
#   docker compose -f deploy/docker-compose.yml down

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    image: nefteboros:dev
    container_name: nefteboros-web
    # .env подключаем через env_file (LANGFUSE_*, GIGACHAT_*, HYDRA_*, BRAVE_*).
    env_file:
      - ../.env
    environment:
      OUROBOROS_SERVER_HOST: 0.0.0.0
      OUROBOROS_SERVER_PORT: "8000"
      OUROBOROS_DATA_DIR: /app/data
      LANGFUSE_ENABLED: "true"
    ports:
      - "8000:8000"
    volumes:
      # Compose интерпретирует строку с `/` как bind mount, иначе как named
      # volume. Default `nefteboros_data` (named). Override на проде:
      #   NEFTEBOROS_HOST_DATA=/root/nefteboros/data
      - ${NEFTEBOROS_HOST_DATA:-nefteboros_data}:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  nefteboros_data:
